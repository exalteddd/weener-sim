<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Ween Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23e0352b'/%3E%3Ccircle cx='20' cy='8' r='4' fill='%232f6fd6'/%3E%3Ccircle cx='32' cy='8' r='4' fill='%23e2a400'/%3E%3Crect x='4' y='26' width='32' height='8' fill='%23261f1b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
/* Peener's paper: ruled sections, serif type. Left: the weens and walls as forms. Right: the text they make, and a picture of day 0. */
:root {
  --paper: #f7efe1; --ink: #2a2520; --ink-2: #6f6455; --rule: #d6c9b2; --field: #fbf6ec; --lav: #e4dbe9;
  --red: #c9483a; --red-deep: #ad3a2e; --violet: #8a78b3;
  --serif: 'EB Garamond', Garamond, Georgia, 'Times New Roman', serif;
  --mono: 'Courier Prime', 'Courier New', ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.35 var(--serif); -webkit-font-smoothing: antialiased;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 10px 30px; }
.wrap { max-width: 1180px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
a { color: inherit; }

header { display: flex; align-items: center; gap: 18px; padding: 4px 4px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
header h1 { margin: 0; font: 500 26px/1 var(--serif); letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
header .sub { color: var(--ink-2); font-style: italic; }
header .links { margin-left: auto; display: flex; gap: 22px; font-style: italic; font-size: 19px; }
header .links a { text-decoration: none; } header .links a:hover { color: var(--red); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 26px; align-items: start; padding-top: 16px; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.add { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.add .lab { font-style: italic; color: var(--ink-2); margin-right: 4px; }
button { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 16px; border-radius: 2px; border: 1px solid #b9ab94;
  background: var(--field); font-style: italic; font-size: 17px; white-space: nowrap; cursor: pointer; }
button:hover { background: #fff; border-color: var(--ink-2); }
button.main { background: var(--red); border-color: var(--red); color: #fff; }
button.main:hover { background: var(--red-deep); border-color: var(--red-deep); }
button.icon { width: 34px; padding: 0; font-style: normal; }

#items { display: grid; gap: 14px; }
.card { background: var(--field); border: 1px solid var(--rule); border-left: 6px solid var(--sw, #999); padding: 12px 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.card .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.card .top h2 { margin: 0; font: 500 21px var(--serif); }
.card .top .kind { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.card .top .tools { margin-left: auto; display: flex; gap: 6px; }
.row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 10px; align-items: start; }
.row > .lbl { font-style: italic; padding-top: 6px; }
@media (max-width: 560px) { .row { grid-template-columns: minmax(0, 1fr); gap: 4px; } .row > .lbl { padding-top: 0; }
  header h1 { font-size: 21px; letter-spacing: .24em; } header .links { margin-left: 0; font-size: 16px; }
  .card { padding: 10px 10px 12px; } .card .top .tools { margin-left: 0; } .fn input[type=text] { width: 8em; } }
.modes { display: inline-flex; border: 1px solid var(--rule); margin-bottom: 6px; }
.modes button { height: 28px; border: 0; border-radius: 0; font-size: 15px; padding: 0 12px; background: transparent; }
.modes button.on { background: var(--ink); color: var(--paper); }
input[type=text], input[type=number], textarea { border: 1px solid var(--rule); background: #fffdf8; padding: 5px 8px; font: 16px var(--mono); border-radius: 2px; min-width: 0; }
input[type=text]:focus, input[type=number]:focus, textarea:focus { outline: none; border-color: var(--ink-2); }
input[type=text].wide, textarea.wide { width: 100%; }
input[type=number] { width: 6.5em; }
.fn { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-style: italic; }
.fn input[type=text] { width: 10em; }
.fn input[type=number], .fn input.to { width: 5.5em; }
.checks { display: grid; gap: 8px; }
.check { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 34px; }
.check > label { display: inline-flex; align-items: center; gap: 10px; font-style: italic; cursor: pointer; min-width: 0; }
.check > label input { flex: none; }
input[type=checkbox] { accent-color: var(--red); width: 20px; height: 20px; margin: 0; }
input[type=color] { width: 42px; height: 32px; padding: 0 2px; border: 1px solid var(--rule); background: #fffdf8; cursor: pointer; }
.hex { width: 7.5em !important; }
input[type=text].wt { width: 8em; }
.err { color: var(--red-deep); font-size: 15px; font-style: italic; }
.code { font: 14px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.empty { color: var(--ink-2); font-style: italic; padding: 20px 4px; }

aside { position: sticky; top: 10px; display: grid; gap: 14px; }
.panel { background: var(--field); border: 1px solid var(--rule); padding: 12px 14px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font: 500 15px var(--serif); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
#out { width: 100%; min-height: 120px; resize: vertical; font: 15px/1.45 var(--mono); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts a.btn { display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 2px; background: var(--red); color: #fff; text-decoration: none; font-style: italic; font-size: 17px; }
.acts a.btn:hover { background: var(--red-deep); }
#prev { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; background: #fffdf8; border: 1px solid var(--rule); }
.note { font-size: 15px; color: var(--ink-2); font-style: italic; }
#impBox { margin-bottom: 14px; }
#impText { width: 100%; min-height: 110px; resize: vertical; font: 15px/1.45 var(--mono); }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ween Builder</h1>
    <span class="sub">build your own weens!</span>
    <span class="links"><a href="../" target="_blank" rel="noopener">Open Peener Sim ↗&#xFE0E;</a></span>
  </header>

  <div class="cols">
    <main>
      <div class="add">
        <span class="lab">Add</span>
        <button type="button" class="main" id="addWeen">+ Ween</button>
        <button type="button" id="addWall">+ Wall</button>
        <span class="lab" style="margin-left:14px">Start from</span>
        <select id="preset" aria-label="Start from an example">
          <option value="">an example…</option>
          <option value="two">Two overlapping weens</option>
          <option value="box">A ween boxed in by walls</option>
          <option value="grow">A wall ween that grows</option>
          <option value="ghost">A ween that ignores walls</option>
          <option value="ripples">Lifespan: ripples</option>
          <option value="lid">Lifespan: a box whose lid vanishes</option>
        </select>
        <button type="button" id="impBtn" aria-expanded="false" aria-controls="impBox">Import…</button>
        <button type="button" id="clearAll" style="margin-left:auto">Clear all</button>
      </div>
      <div class="panel" id="impBox" hidden>
        <h3>Import</h3>
        <div class="note">Paste anything Peener Sim accepts: each ween and wall becomes a card you can edit.</div>
        <textarea id="impText" spellcheck="false" aria-label="Peener text to import" placeholder="{[0,0] : [1,0] [0,1] [-1,-1] ; color #2f6fd6 ; lifespan 10}  wall{<t, 12> t=-12..12}"></textarea>
        <div class="acts">
          <button type="button" class="main" id="impReplace">Replace all</button>
          <button type="button" id="impAdd">Add to top</button>
          <button type="button" id="impUndo" hidden>Undo</button>
          <button type="button" id="impCancel">Cancel</button>
        </div>
        <div class="err" id="impErr" hidden></div>
        <div class="note" id="impNote" hidden></div>
      </div>
      <div id="items"></div>
    </main>

    <aside>
      <div class="panel">
        <h3>Your input</h3>
        <textarea id="out" readonly spellcheck="false" aria-label="The input text for Peener Sim"></textarea>
        <div class="acts">
          <a class="btn" id="open" href="../" target="_blank" rel="noopener">Open in Peener Sim ↗&#xFE0E;</a>
          <button type="button" id="copy">Copy</button>
        </div>
        <div class="err" id="outErr" hidden></div>
      </div>
      <div class="panel">
        <h3>Day 0</h3>
        <canvas id="prev" width="440" height="440" aria-label="Where each ween starts and where the walls are"></canvas>
        <div class="note" id="prevNote">● ween  ◆ wall ween  ■ wall.</div>
      </div>
    </aside>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const PALETTE = ["#e0352b", "#2f6fd6", "#e2a400", "#2e9d5b", "#8e44ad", "#e67e22", "#16a5a5", "#d63384"];
const WALL = "#26211d", WALLWEEN = "#56607a";   // plain walls near-black; wall weens slate
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ── state ────────────────────────────────────────────────────────────────────────────────────────
// a set of points is { mode: "points" | "fn" | "text", points, fx, fy, from, to, step, text }
const pointSet = (points, fn) => ({ mode: fn ? "fn" : "points", points: points || "", fx: fn ? fn[0] : "t", fy: fn ? fn[1] : "0", from: fn ? fn[2] : -10, to: fn ? fn[3] : 10, step: 1, text: "" });
const newWeen = (k, o = {}) => ({ kind: "ween", starts: pointSet("0,0"), moves: pointSet("1,0 0,1 -1,-1"),
  useDay: false, day: 0, useColor: true, color: PALETTE[k % PALETTE.length], useWeight: false, weight: 1, useLife: false, life: 10, wall: false, blocked: true, ...o });
const newWall = (o = {}) => ({ kind: "wall", pts: pointSet("", ["t", "10", -20, 20]), color: WALL, ...o });
let items = [];
try { items = JSON.parse(localStorage.getItem("weenbuilder:v1") || "null") || []; } catch { items = []; }
if (!Array.isArray(items) || !items.length) items = [newWeen(0)];
const save = () => { try { localStorage.setItem("weenbuilder:v1", JSON.stringify(items)); } catch {} };

// ── points → Peener text, and a light check ───────────────────────────────────────────────────────
const NUM = String.raw`-?\d+(?:\.\d+)?(?:\/\d+)?`;
function pointsText(ps) {
  if (ps.mode === "text") return { text: ps.text.trim(), err: ps.text.trim() ? "" : "Type some points." };
  if (ps.mode === "fn") {
    const fx = ps.fx.trim(), fy = ps.fy.trim();
    if (!fx || !fy) return { text: "", err: "Fill in both x and y." };
    if (!/^[\w\s+\-*/^%().,]*$/.test(fx + fy)) return { text: "", err: "x and y can use numbers, t, + − * / ^, ( ), pi, e and functions like sqrt exp log sin cos round floor ceil abs min max." };
    const open = String(ps.to ?? "").trim() === "", a = Number(ps.from), b = Number(ps.to), st = Number(ps.step) || 1;
    if (!Number.isInteger(a) || (!open && !Number.isInteger(b))) return { text: "", err: "The range for t needs whole numbers." };
    if (!open && b < a) return { text: "", err: "The range for t runs backwards." };
    if (!Number.isInteger(st) || st < 1) return { text: "", err: "The step must be a whole number of 1 or more." };
    return { text: `<${fx}, ${fy}> t=${a}..${open ? "" : b}${st !== 1 ? ` step ${st}` : ""}`, err: "", open };
  }
  const raw = ps.points.trim();
  if (!raw) return { text: "", err: "" };
  const re = new RegExp(String.raw`[(\[]?\s*(${NUM})\s*,\s*(${NUM})\s*[)\]]?`, "g");
  const pairs = []; let m, used = "";
  while ((m = re.exec(raw))) { pairs.push(`[${m[1]},${m[2]}]`); used += m[0]; }
  const leftover = raw.replace(re, "").replace(/[\s,;]/g, "");
  if (leftover) return { text: "", err: `Can't read "${leftover.slice(0, 20)}". Write points as x,y pairs, like 0,1 2,-1.` };
  return { text: pairs.join(" "), err: "" };
}
const hexOk = (h) => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h);
const colourFormula = (c) => { const m = /^\s*(?:hsla?|rgba?)\s*\((.*)\)\s*$/i.exec(String(c || "")); return !!m && /[a-z_]/i.test(m[1]); };   // like hsl(30t, 80%, 50%)
const OPEN_RANGE = /\b[a-zA-Z_]\w*\s*(?:=|\bin\b|\bfrom\b)\s*-?\d+\s*\.\.(?!\s*-?\d)/;   // k=1.. with no end, as Peener reads it
function itemText(it) {
  if (it.kind === "wall") {
    const p = pointsText(it.pts);
    if (p.err || !p.text) return { text: "", err: p.err || "Give the wall some points." };
    return { text: `wall{${p.text}${hexOk(it.color) && it.color.toLowerCase() !== WALL ? ` ; color ${it.color}` : ""}}`, err: "" };
  }
  const s = pointsText(it.starts), m = pointsText(it.moves);
  if (s.err) return { text: "", err: "Starts: " + s.err };
  if (!s.text) return { text: "", err: "Starts: give at least one point." };
  if (m.err) return { text: "", err: "Moves: " + m.err };
  if (m.open || OPEN_RANGE.test(m.text)) return { text: "", err: "Moves: only starting dots can go on forever; give t an end." };
  const opts = [];
  // the start day: a number, or a formula in the starting dots' variable (each dot then appears on its own day)
  const dayTxt = it.useDay ? String(it.day ?? "").trim() : "", dayNum = dayTxt !== "" && Number.isFinite(Number(dayTxt)), dayFn = !!dayTxt && !dayNum;
  if (dayFn && !/^[\w\s+\-*/^%().,]+$/.test(dayTxt)) return { text: "", err: "Starts on day: a whole number, or a formula in the starting dots' variable like 3t." };
  if (dayNum && !(Number(dayTxt) >= 0)) return { text: "", err: "Starts on day: days start at 0." };
  const forever = s.open || OPEN_RANGE.test(s.text);
  if (forever && !dayFn) return { text: "", err: dayNum
    ? `Starts on day ${dayTxt} would put endless dots on that one day, since “to” is empty (forever). Give “to” an end, or make the day grow with t, like 3t.`
    : "Starting dots that go on forever (“to” is empty) need a day for each: tick Starts on day and write a formula like 3t, or give “to” an end." };
  if (dayFn && it.starts.mode === "points") return { text: "", err: `Starts on day ${dayTxt} is a formula, so each starting dot needs its own t: write the starts as a Function of t, or give a plain day like 3.` };
  if (dayNum) opts.push(`day ${Math.round(Number(dayTxt))}`);   // ticked: written even when it is 0
  if (dayFn) opts.push(`day ${dayTxt}`);
  if (it.useColor && hexOk(it.color)) opts.push(`color ${it.color}`);
  else if (it.useColor && colourFormula(it.color)) opts.push(`color ${it.color.trim()}`);   // a colour per starting dot, like hsl(30t, 80%, 50%)
  if (it.useWeight) {   // a number, or a formula in n (the day), like 2n+1
    const w = String(it.weight ?? "").trim(), v = Number(w);
    if (w !== "" && Number.isFinite(v)) { if (v !== 1) opts.push(`weight ${v}`); }
    else if (weightOk(w)) opts.push(`weight ${w}`);
    else return { text: "", err: "Weight: a number, or a formula in n (the day) like 2n+1." };
  }
  if (it.useLife) {   // whole days, or a formula in n (the day a dot appears), like n+1
    const l = String(it.life ?? "").trim(), v = Number(l), bad = { text: "", err: "Lifespan: a whole number of days, 1 or more, or a formula in n like n+1." };
    if (l !== "" && Number.isFinite(v)) { const L = Math.round(v); if (!(L >= 1)) return bad; opts.push(`lifespan ${L}`); }
    else if (weightOk(l)) opts.push(`lifespan ${l}`);
    else return bad;
  }
  if (it.wall) opts.push("wall");
  if (!it.blocked) opts.push("ignores walls");
  return { text: `{${s.text}${m.text ? " : " + m.text : ""}${opts.map((o) => " ; " + o).join("")}}`, err: "" };   // no moves: no colon
}

// ── forms ─────────────────────────────────────────────────────────────────────────────────────────
function pointsForm(key, ps, label) {
  const modes = [["points", "Points"], ["fn", "Function"], ["text", "Text"]].map(([v, t]) => `<button type="button" data-mode="${key}:${v}" class="${ps.mode === v ? "on" : ""}">${t}</button>`).join("");
  let body;
  if (ps.mode === "points") body = `<input type="text" class="wide" data-f="${key}.points" value="${esc(ps.points)}" placeholder="0,1 2,-1 …" spellcheck="false">`;
  else if (ps.mode === "fn") body = `<div class="fn">x = <input type="text" data-f="${key}.fx" value="${esc(ps.fx)}" aria-label="x of t" spellcheck="false">
      y = <input type="text" data-f="${key}.fy" value="${esc(ps.fy)}" aria-label="y of t" spellcheck="false"> for t from
      <input type="number" data-f="${key}.from" value="${esc(ps.from)}" aria-label="t from"> to <input ${key === "starts" ? 'type="text" inputmode="numeric" class="to" placeholder="∞" title="Leave empty to keep making dots forever"' : 'type="number"'} data-f="${key}.to" value="${esc(ps.to)}" aria-label="t to">
      step <input type="number" data-f="${key}.step" value="${esc(ps.step)}" min="1" aria-label="step"></div>
      <div class="note">Values round down to whole numbers; write ceil(…) to round up, round(…) for the nearest.${key === "starts" ? " Leave “to” empty to keep making dots forever, each on its own day: tick Starts on day and write a formula like 3t." : ""}</div>`;
  else body = `<input type="text" class="wide" data-f="${key}.text" value="${esc(ps.text)}" placeholder="anything Peener accepts, e.g. <round(9cos(2pi t/12)), round(9sin(2pi t/12))> t=0..11" spellcheck="false">`;
  return `<div class="row"><span class="lbl">${label}</span><div><div class="modes" role="group" aria-label="${label}">${modes}</div>${body}</div></div>`;
}
function render() {
  const box = $("items");
  if (!items.length) { box.innerHTML = `<div class="empty">Nothing yet. Add a ween or a wall.</div>`; update(); return; }
  let wn = 0, wl = 0;
  box.innerHTML = items.map((it, i) => {
    const title = it.kind === "wall" ? `Wall ${++wl}` : `Ween ${++wn}`;
    const sw = it.kind === "wall" ? it.color : it.useColor ? it.color : it.wall ? WALLWEEN : PALETTE[(wn - 1) % PALETTE.length];
    const tools = `<span class="tools"><button type="button" class="icon" data-act="up:${i}" title="Move up" aria-label="Move up">↑</button><button type="button" class="icon" data-act="down:${i}" title="Move down" aria-label="Move down">↓</button><button type="button" data-act="dup:${i}">Duplicate</button><button type="button" data-act="del:${i}">Remove</button></span>`;
    const colour = (on) => `<input type="color" data-f="color" value="${hexOk(it.color) && it.color.length === 7 ? it.color : "#000000"}" ${on ? "" : "disabled"} aria-label="Colour"><input type="text" class="hex" data-f="color" value="${esc(it.color)}" ${on ? "" : "disabled"} aria-label="Colour as hex, or a formula like hsl(30t, 80%, 50%)" title="A hex colour, or a formula in the starting dots' variable, like hsl(30t, 80%, 50%)" spellcheck="false">`;
    let body;
    if (it.kind === "wall") {
      body = pointsForm("pts", it.pts, "Wall points") +
        `<div class="row"><span class="lbl">Colour</span><div class="check">${colour(true)}</div></div>
         <div class="note">A wall never grows and isn't counted. Weens can't land on it or cross it.</div>`;
    } else {
      body = pointsForm("starts", it.starts, "Starts at") + pointsForm("moves", it.moves, "Moves") +
        `<div class="row"><span class="lbl">Options</span><div class="checks">
          <div class="check"><label><input type="checkbox" data-f="useDay" ${it.useDay ? "checked" : ""}> Starts on day</label><input type="text" class="wt" data-f="day" value="${esc(it.day)}" ${it.useDay ? "" : "disabled"} placeholder="0 or 3t" aria-label="Start day" spellcheck="false"><span class="note">a number, or a formula in t: each starting dot appears on its own day</span></div>
          <div class="check"><label><input type="checkbox" data-f="useColor" ${it.useColor ? "checked" : ""}> Colour</label>${colour(it.useColor)}</div>
          <div class="check"><label><input type="checkbox" data-f="useWeight" ${it.useWeight ? "checked" : ""}> Weight</label><input type="text" class="wt" data-f="weight" value="${esc(it.weight)}" ${it.useWeight ? "" : "disabled"} placeholder="2 or 2n+1" aria-label="Weight" spellcheck="false"><span class="note">a number, or a formula in n (the day)</span></div>
          <div class="check"><label><input type="checkbox" data-f="useLife" ${it.useLife ? "checked" : ""}> Lifespan</label><input type="text" class="wt" data-f="life" value="${esc(it.life ?? 10)}" ${it.useLife ? "" : "disabled"} placeholder="10 or n+1" aria-label="Lifespan in days" spellcheck="false"><span class="note">days: each dot vanishes that long after it appears (a formula in n: n is the day it appears)</span></div>
          <div class="check"><label><input type="checkbox" data-f="wall" ${it.wall ? "checked" : ""}> Acts as a wall: no other ween, wall weens included, can land on or cross its dots</label></div>

      if (!body.trim()) warn.push(`${name} has no points.`);
      parts.slice(1).forEach((p) => {
        if (!p.trim()) return;
        const c = /^\s*colou?r\s*[:=]?\s*(.+?)\s*$/i.exec(p), hex = c && toHex(c[1]);
        if (hex) wall.color = hex; else warn.push(c ? `${name}: "${c[1]}" is not a colour.` : `${name}: skipped "${p.trim()}".`);
      });
      out.push(wall); continue;
    }
    const name = `Ween ${wn + 1}`, o = { useColor: false };
    parts.slice(1).forEach((p) => {
      if (!p.trim()) return;
      if (/^\s*wall\s*$/i.test(p)) { o.wall = true; return; }
      if (/^\s*(ignores?\s+walls?|through\s+walls?|ghost)\s*$/i.test(p)) { o.blocked = false; return; }
      let k;
      if ((k = /^\s*(?:lifespan|life|lives)\s*[:=]?\s*(.+?)\s*(?:days?)?\s*$/i.exec(p))) {
        const L = Number(k[1]);
        if (Number.isInteger(L) && L >= 1) { o.useLife = true; o.life = L; }
        else if (!Number.isFinite(L) && weightOk(k[1])) { o.useLife = true; o.life = k[1]; }   // a formula in n
        else warn.push(`${name}: a lifespan must be a whole number of days, 1 or more, or a formula in n; got "${k[1]}".`);
      } else if ((k = /^\s*(?:day|start)\s*[:=]?\s*(.+?)\s*$/i.exec(p))) {
        const d = Number(k[1]);
        if (Number.isInteger(d) && d >= 0) { o.useDay = d > 0; o.day = d; }
        else if (!Number.isFinite(d) && /^[\w\s+\-*/^%().,]+$/.test(k[1]) && /[a-z]/i.test(k[1])) { o.useDay = true; o.day = k[1]; }   // a day for each starting dot, like 3k
        else warn.push(`${name}: a start day must be a whole number, 0 or more, or a formula like 3k; got "${k[1]}".`);
      } else if ((k = /^\s*weight\s*[:=]?\s*(.+?)\s*$/i.exec(p))) {
        const w = Number(k[1]);
        if (Number.isFinite(w)) { o.useWeight = w !== 1; o.weight = w; }
        else if (weightOk(k[1])) { o.useWeight = true; o.weight = k[1]; }   // a formula in n, the day
        else warn.push(`${name}: a weight must be a number or a formula in n, like 2n+1; got "${k[1]}".`);
      } else if ((k = /^\s*colou?r\s*[:=]?\s*(.+?)\s*$/i.exec(p))) {
        const hex = toHex(k[1]);
        if (hex) { o.useColor = true; o.color = hex; }
        else if (colourFormula(k[1])) { o.useColor = true; o.color = k[1].trim(); }   // a colour per starting dot, like hsl(30t, 80%, 50%)
        else warn.push(`${name}: "${k[1]}" is not a colour.`);
      } else warn.push(`${name}: skipped "${p.trim()}".`);
    });
    const sm = splitTop(body, ":"), L = sm ? sm[0] : body, R = sm ? sm[1] : "";
    if (!L.trim()) warn.push(`${name} has no starting points.`);
    if (!o.useColor && o.wall) o.color = WALLWEEN;
    out.push(newWeen(wn++, { starts: setOf(L), moves: setOf(R), ...o }));
  }
  return { items: out, warn };
}
const impShow = (on) => { $("impBox").hidden = !on; $("impBtn").setAttribute("aria-expanded", String(on)); if (on) { $("impErr").hidden = $("impNote").hidden = $("impUndo").hidden = true; $("impCancel").textContent = "Cancel"; $("impText").focus(); } };
function doImport(replace) {
  let res;
  try { res = parsePeener($("impText").value); } catch (e) { $("impErr").textContent = e.message; $("impErr").hidden = false; $("impNote").hidden = true; return; }
  if (!res.items.length) { $("impErr").textContent = "Nothing to import. Paste weens like {[0,0] : [1,0] [0,1]} or walls like wall{<t, 10> t=-20..20}."; $("impErr").hidden = false; $("impNote").hidden = true; return; }
  items = replace ? res.items : [...res.items, ...items];
  render();
  const nw = res.items.filter((x) => x.kind === "ween").length, nl = res.items.length - nw;
  const said = `Imported ${nw} ween${nw === 1 ? "" : "s"}${nl ? ` and ${nl} wall${nl === 1 ? "" : "s"}` : ""}.`;
  $("impErr").hidden = true;
  if (res.warn.length) { $("impNote").textContent = `${said} Not imported: ${res.warn.join(" ")}`; $("impNote").hidden = false; $("impCancel").textContent = "Close"; }   // keep the box open so the notes can be read
  else { impShow(false); toast(said); }
  document.querySelector(".card")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
$("impBtn").addEventListener("click", () => impShow($("impBox").hidden));
$("impCancel").addEventListener("click", () => impShow(false));
$("impReplace").addEventListener("click", () => doImport(true));
$("impAdd").addEventListener("click", () => doImport(false));
$("impText").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doImport(true); } else if (e.key === "Escape") impShow(false); });
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 1600); }
$("copy").addEventListener("click", () => {
  const v = $("out").value;
  const fb = () => { $("out").select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} toast(ok ? "Copied" : "Select the text and copy it"); };
  try { navigator.clipboard.writeText(v).then(() => toast("Copied"), fb); } catch { fb(); }
});
render();
// opened from Peener Sim (…/builder/#in=<its input>): load that input as cards; Undo brings back the cards from before
let undoItems = null;
function fromPeener() {
  const m = /^#in=(.*)$/s.exec(location.hash); if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);   // a reload doesn't load it again
  let txt; try { txt = decodeURIComponent(m[1]).trim(); } catch { return; }
  if (!txt) return;
  impShow(true); $("impText").value = txt;
  let res; try { res = parsePeener(txt); } catch (e) { $("impErr").textContent = e.message; $("impErr").hidden = false; return; }
  if (!res.items.length) return;
  undoItems = items; items = res.items; render();
  const nw = res.items.filter((x) => x.kind === "ween").length, nl = res.items.length - nw;
  $("impNote").textContent = `Loaded from Peener Sim: ${nw} ween${nw === 1 ? "" : "s"}${nl ? ` and ${nl} wall${nl === 1 ? "" : "s"}` : ""}.`
    + (res.warn.length ? ` Not imported: ${res.warn.join(" ")}` : "") + " Undo brings back the cards you had before.";
  $("impNote").hidden = false; $("impUndo").hidden = false; $("impCancel").textContent = "Close";
}
fromPeener(); addEventListener("hashchange", fromPeener);   // also when the builder is already open
$("impUndo").addEventListener("click", () => { if (undoItems) { items = undoItems; undoItems = null; render(); toast("Your previous cards are back"); } impShow(false); });
</script>
